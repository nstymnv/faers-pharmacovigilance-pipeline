
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'faers_transformations'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'faers_transformations'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# Every layer is built as tables in its own schema (see generate_schema_name).
# Individual models can override this with `{{ config(...) }}`.
models:
  faers_transformations:
    staging:
      +materialized: table
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: mart
      # Mart descriptions are pushed into Snowflake's own comments, so anyone
      # browsing MART sees them, rather than living only in dbt docs.
      +persist_docs:
        relation: true
        columns: true

vars:
  # Quarters a dev/CI run is restricted to, so a full-backfill warehouse doesn't
  # have to be rebuilt to test a model change. An empty list means all quarters.
  faers_quarters: []

  # Analysis window the marts report on: five full calendar years, so trends
  # compare whole years. Fixed permanently at 2021-2025 (decided 2026-09-29):
  # the project is a reproducible snapshot, and README results depend on it. Quarters outside it (2020q1, the dev slice, and new
  # quarters once they are published) stay in RAW, staging and intermediate.
  # Ignored while faers_quarters is set; see faers_mart_window_filter.
  mart_start_quarter: '2021q1'
  mart_end_quarter: '2025q4'

  # Drug characterizations treated as causally implicated in the event, and so
  # eligible for the drug-reaction bridge and disproportionality analysis.
  # FAERS 1 (suspect) and 3 (interacting) are both causal attributions; 2
  # (concomitant) is what the patient happened to also be taking. Kept as a var
  # so the signal mart can be re-run on suspect alone without a code change.
  implicated_drug_roles: ['suspect', 'interacting']

  # Largest group of reports sharing a case identifier that is still treated as
  # one patient's case and collapsed to a single report (int_linked_reports).
  # Bigger groups are mostly literature articles describing several patients.
  linked_case_max_reports: 5

  # Evans criteria for calling a drug-reaction pair a signal: at least three
  # co-reported cases, PRR at or above 2, and a Yates-corrected chi-square at
  # or above 4. The conventional first-pass screen in FAERS literature.
  signal_min_cases: 3
  signal_min_prr: 2
  signal_min_chi2: 4
