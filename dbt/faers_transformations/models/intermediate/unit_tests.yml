unit_tests:

  - name: test_report_version_merge
    model: int_reports
    description: >
      The version merge takes each field's latest non-null value rather than the
      latest row, drops FDA-retracted reports, and spans every quarter a report
      was published in.

      Report 1 has two versions. Version 2 omits source_country and
      company_number, so both must come from version 1, while serious, which
      version 2 does supply, must come from version 2 even though it changed.
      Version 2 is also republished in 2020q3: that later publication must win
      the per-version dedupe and extend the quarter span, but
      not count as a third version. Report 2 is retracted and must disappear.
      Report 3 has one version and passes through.
    given:
      - input: ref('stg_reports')
        rows:
          - {report_id: 1, version: 1, source_quarter: '2020q1', transmission_date: '2020-01-10',
             receipt_date: '2020-01-05', source_country: 'US', serious: 'yes', company_number: 'A-1'}
          - {report_id: 1, version: 2, source_quarter: '2020q2', transmission_date: '2020-04-10',
             receipt_date: '2020-04-02', source_country: null, serious: 'no', company_number: null}
          - {report_id: 1, version: 2, source_quarter: '2020q3', transmission_date: '2020-07-10',
             receipt_date: '2020-04-03', source_country: null, serious: 'no', company_number: null}
          - {report_id: 2, version: 1, source_quarter: '2020q1', transmission_date: '2020-01-10',
             receipt_date: '2020-01-05', source_country: 'FR', serious: 'yes', company_number: 'B-1'}
          - {report_id: 3, version: 1, source_quarter: '2020q2', transmission_date: '2020-04-10',
             receipt_date: '2020-04-01', source_country: 'JP', serious: 'no', company_number: 'C-1'}
      - input: ref('stg_deleted_cases')
        rows:
          - {report_id: 2}
    expect:
      rows:
        # receipt_date comes from the 2020q3 copy of version 2: the per-version
        # dedupe keeps the latest publication.
        - {report_id: 1, version: 2, first_seen_quarter: '2020q1', last_seen_quarter: '2020q3',
           receipt_date: '2020-04-03', source_country: 'US', serious: 'no', company_number: 'A-1'}
        - {report_id: 3, version: 1, first_seen_quarter: '2020q2', last_seen_quarter: '2020q2',
           receipt_date: '2020-04-01', source_country: 'JP', serious: 'no', company_number: 'C-1'}

  - name: test_linked_report_groups
    model: int_linked_reports
    description: >
      Which groups of reports sharing a case identifier count as one patient.
      A qualifies (two reports, same sex, same age once converted to years,
      one sex missing). B does not: the sexes conflict. C does not: six reports
      is above linked_case_max_reports, the shape of a literature article
      covering several patients. D does not: a single report links to nothing.
      Report 12 has no duplicate block at all. E qualifies: a sex coded
      'unknown' is not a known sex and does not conflict with 'male'.
    given:
      - input: ref('int_reports')
        rows:
          - {report_id: 1, duplicate_numb: 'A'}
          - {report_id: 2, duplicate_numb: 'A'}
          - {report_id: 3, duplicate_numb: 'B'}
          - {report_id: 4, duplicate_numb: 'B'}
          - {report_id: 5, duplicate_numb: 'C'}
          - {report_id: 6, duplicate_numb: 'C'}
          - {report_id: 7, duplicate_numb: 'C'}
          - {report_id: 8, duplicate_numb: 'C'}
          - {report_id: 9, duplicate_numb: 'C'}
          - {report_id: 10, duplicate_numb: 'C'}
          - {report_id: 11, duplicate_numb: 'D'}
          - {report_id: 12, duplicate_numb: null}
          - {report_id: 13, duplicate_numb: 'E'}
          - {report_id: 14, duplicate_numb: 'E'}
      - input: ref('int_demographics')
        rows:
          - {report_id: 1, sex: 'female', onset_age: 60, age_unit: 'Year'}
          - {report_id: 2, sex: null, onset_age: 720, age_unit: 'Month'}
          - {report_id: 3, sex: 'female', onset_age: 40, age_unit: 'Year'}
          - {report_id: 4, sex: 'male', onset_age: 40, age_unit: 'Year'}
          - {report_id: 13, sex: 'male', onset_age: 55, age_unit: 'Year'}
          - {report_id: 14, sex: 'unknown', onset_age: 55, age_unit: 'Year'}
    expect:
      rows:
        - {report_id: 1, linked_case_id: 'A'}
        - {report_id: 2, linked_case_id: 'A'}
        - {report_id: 13, linked_case_id: 'E'}
        - {report_id: 14, linked_case_id: 'E'}
