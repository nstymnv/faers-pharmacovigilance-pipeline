version: 2

models:

  - name: int_reports
    description: >
      Canonical FAERS report-level records with duplicate versions consolidated
      into a single record per report_id. Reports retracted by FDA are excluded;
      see models/README.md for the duplicate and retraction policy.

    columns:
      - name: report_id
        description: Unique FAERS safety report identifier.
        data_tests:
          - not_null
          - unique

      - name: version
        description: Latest version of the FAERS report.

      - name: first_seen_quarter
        description: >
          Earliest FAERS quarter (e.g. 2020q1) any version of the report was
          published in. With last_seen_quarter, the span the marts' analysis
          window is checked against.
        data_tests:
          - not_null

      - name: last_seen_quarter
        description: Latest FAERS quarter any version of the report was published in.
        data_tests:
          - not_null

      - name: receipt_date
        description: Date the latest report information was received.

      - name: transmission_date
        description: Date the report was transmitted.

      - name: source_country
        description: ISO code of the country from which the report originated, merged across versions.

      - name: source_country_name
        description: Readable name of source_country, from the country_mapping seed.

      - name: occurrence_country
        description: ISO code of the country where the adverse event occurred, merged across versions.

      - name: occurrence_country_name
        description: Readable name of occurrence_country, from the country_mapping seed.

      - name: report_type
        description: >
          How the report reached FDA (spontaneous / report from study / other /
          not available to sender), merged across versions.

      - name: serious
        description: Whether the adverse event was serious (yes/no), merged across versions.

      - name: congenital_anomaly
        description: >
          Boolean: whether the adverse event involved a congenital anomaly. A FAERS presence flag decoded to a total
          boolean (absent = false), so it can be summed directly. Merged
          across versions.

      - name: death
        description: >
          Boolean: whether the adverse event resulted in death. A FAERS presence flag decoded to a total
          boolean (absent = false), so it can be summed directly. Merged
          across versions.

      - name: disabling
        description: >
          Boolean: whether the adverse event was disabling. A FAERS presence flag decoded to a total
          boolean (absent = false), so it can be summed directly. Merged
          across versions.

      - name: hospitalization
        description: >
          Boolean: whether the adverse event required hospitalization. A FAERS presence flag decoded to a total
          boolean (absent = false), so it can be summed directly. Merged
          across versions.

      - name: lifethreatening
        description: >
          Boolean: whether the adverse event was life-threatening. A FAERS presence flag decoded to a total
          boolean (absent = false), so it can be summed directly. Merged
          across versions.

      - name: other_serious
        description: >
          Boolean: whether another, otherwise-uncategorized seriousness criterion
          applied. A FAERS presence flag decoded to a total boolean
          (absent = false), so it can be summed directly. Merged across
          versions.

      - name: fulfill_expedite_criteria
        description: Whether the report fulfills expedite criteria, merged across versions.

      - name: duplicate_flag
        description: >
          FAERS duplicate element. Despite the name this does NOT mark a
          redundant report — it is set on 94% of reports and never identifies a
          collision. Not used as a filter anywhere; see models/README.md.

      - name: duplicate_numb
        description: >
          Sender's own case number (byte-identical to company_number on every
          row where it is populated). A case-linkage identifier, not a pointer
          to a redundant report.

      - name: duplicate_source
        description: Organisation that supplied duplicate_numb.

      - name: authority_number
        description: Regulatory authority's case number for the report.

      - name: company_number
        description: Reporting company's internal case number for the report.


  - name: int_demographics
    description: >
      Consolidated demographic information for each FAERS report. One row per
      report_id; retracted reports excluded.

    columns:
      - name: report_id
        description: FAERS safety report identifier.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('int_reports')
                field: report_id

      - name: age_group
        description: Standardized patient age group, merged across versions.

      - name: onset_age
        description: Patient age at onset of the adverse event, merged across versions.

      - name: age_unit
        description: Unit used for onset age, merged across versions.

      - name: sex
        description: >
          Standardized patient sex, merged across versions. Null where no sex
          was reported, distinct from the reported value "unknown".

      - name: weight_kg
        description: Patient weight in kilograms, merged across versions.


  - name: int_drugs
    description: >
      Drug entries associated with FAERS reports, taken from each report's latest
      version. One row per (report_id, drug_index) — per drug *entry*, not per
      distinct product: a report lists a drug once per administered dose, so the
      same product recurs legitimately. Collapse to one row per product in the
      marts by counting distinct reports. Retracted reports excluded.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - report_id
              - drug_index

    columns:
      - name: report_id
        description: FAERS safety report identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_reports')
                field: report_id

      - name: drug_index
        description: >
          Position of this drug entry within its report, assigned by the parser.
          Distinguishes repeated dose entries for the same product; only
          meaningful within the report version this row came from.
        data_tests:
          - not_null

      - name: version
        description: FAERS report version this drug record was last seen in (see stg_drugs; not merged across versions — see the model header comment for why).

      - name: medicinal_product
        description: Standardized medicinal product name.

      - name: active_substance
        description: Active substance of the medicinal product.

      - name: drug_characterization
        description: Role of the drug in the adverse event report.

      - name: drug_indication
        description: Indication for which the drug was used.

      - name: drug_batch_number
        description: Manufacturer batch/lot number for the drug.

      - name: drug_authorization_number
        description: Marketing authorization number for the drug.

      - name: administration_route
        description: Route of administration (e.g. oral, intravenous).

      - name: dosage_amount
        description: Numeric dose amount as reported.

      - name: dosage_unit_code
        description: >
          Raw FAERS dosage-unit code, kept so a dose with an unresolved unit
          stays visibly unresolved. See stg_drugs.

      - name: dosage_unit
        description: >
          Decoded SI unit for dosage_amount (kg, g, mg, µg), from the
          dosage_unit_mapping seed. Null for codes outside the four FDA
          documents — see stg_drugs.

      - name: start_date
        description: Date the drug treatment started.

      - name: end_date
        description: Date the drug treatment ended.

      - name: duration
        description: Reported treatment duration, in the unit given by duration_unit.

      - name: duration_unit
        description: Unit for duration (e.g. day, week).

      - name: drug_recurrence
        description: >
          Whether the adverse event recurred when this drug was
          re-administered (yes/no/unknown). Distinct from recurrence_action,
          which is the action code from that recurrence event rather than
          whether recurrence happened at all — see stg_drugs for detail.

      - name: recurrence_action
        description: >
          Action-code associated with a recurrence-administration event for
          this drug. Distinct from drug_recurrence: this is the outcome of a
          specific recurrence event, not whether recurrence was reported at
          all — see stg_drugs for detail.

      - name: taken_action
        description: >
          Decoded action taken with the drug in response to the adverse event
          (drug withdrawn / dose reduced / dose increased / dose not changed /
          unknown / not applicable).

      - name: use_stopped_reduced
        description: >
          Dechallenge outcome: whether the event abated after the drug was
          stopped or reduced — not whether it was stopped. See stg_drugs.


  - name: int_reactions
    description: >
      Deduplicated adverse reaction records associated with FAERS reports, taken
      from each report's latest version. One row per (report_id, reaction);
      conflicting outcomes for the same reaction resolve to the most severe.
      Retracted reports excluded.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - report_id
              - reaction

    columns:
      - name: report_id
        description: FAERS safety report identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_reports')
                field: report_id

      - name: version
        description: FAERS report version this reaction record was last seen in (see stg_reaction; not merged across versions — see the model header comment for why).

      - name: reaction
        description: Reported adverse reaction.

      - name: meddra_version
        description: >
          Latest MedDRA version this reaction was coded under on the report. Not
          part of the key: keying on it kept a re-coded reaction as two rows.

      - name: outcome
        description: >
          Standardized outcome of the reported reaction. Where a report gave the
          same reaction conflicting outcomes, the most clinically severe wins
          (fatal > sequelae > not recovered > recovering > recovered > unknown),
          so a fatal outcome is never masked by a co-reported recovery.

      - name: custom_reaction_group
        description: Internal grouping key for the reaction (project-defined MedDRA-derived grouping, not a FAERS field).

      - name: custom_reaction_group_label
        description: Human-readable label for custom_reaction_group.

      - name: custom_reaction_group_basis
        description: >
          Whether this reaction was assigned to its group by an explicit rule
          or by fallback, from the custom_reaction_groups_mapping seed. Lets
          consumers tell a confident grouping from a catch-all one.

