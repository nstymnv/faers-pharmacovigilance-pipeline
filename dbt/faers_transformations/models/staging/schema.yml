version: 2

models:
  - name: stg_demographics
    description: "Model for cleaning and transforming the FAERS demographics data"
    columns:
      - name: report_id
        description: "FAERS safety report identifier. Anchors joins to the other staging models; not unique on its own since a report can have multiple versions (see version)."
        data_tests:
          - not_null
      - name: version
        description: "FAERS report version number (safetyreportversion). Multiple versions of the same report_id are consolidated in int_demographics."
      - name: age_group
        description: "Decoded patient age group: one of neonate, infant, child, adolescent, adult, elderly (from the FAERS patientagegroup code 1-6)."
        data_tests:
          - accepted_values:
              arguments:
                values: ["neonate", "infant", "child", "adolescent", "adult", "elderly"]
              config:
                severity: warn
      - name: onset_age
        description: "The age of the patient at the time of the adverse event"
      - name: age_unit
        description: "Unit for onset_age (e.g. year, month, day), decoded from the FAERS patientonsetageunit code via the time_unit_code_mapping seed."
      - name: sex
        description: >
          Decoded patient sex: male, female, or unknown, from the FAERS
          patientsex code 0/1/2. Null when the report gives no sex at all —
          distinct from the code 0 "unknown", which is a reported value. The
          two were previously merged, which put 47,681 unreported rows into a
          category holding 92 real ones.
        data_tests:
          - accepted_values:
              arguments:
                values: ["male", "female", "unknown"]
              config:
                severity: warn
      - name: weight_kg
        description: "Patient weight in kilograms (FAERS patientweight)."

  - name: stg_drugs
    description: "Model for cleaning and transforming the FAERS drug data"
    columns:
      - name: report_id
        description: "FAERS safety report identifier. Anchors joins to the other staging models; not unique on its own since a report can have multiple versions (see version) and multiple drugs per version."
        data_tests:
          - not_null
      - name: version
        description: "FAERS report version number (safetyreportversion). int_drugs keeps only each report's latest version."
      - name: drug_index
        description: "Position of this drug entry within its report, from the parser's posexplode. A report lists a drug once per administered dose, so (report_id, drug_index) is what keeps repeated dose entries for the same product distinct."
        data_tests:
          - not_null
      - name: medicinal_product
        description: "The name of the medicinal product"
        data_tests:
          - not_null
      - name: active_substance
        description: "The active substance in the medicinal product"
        data_tests:
          - not_null
      - name: drug_characterization
        description: "The characterization of the drug (e.g., suspect, concomitant)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["suspect", "concomitant", "interacting"]
              config:
                severity: warn
      - name: drug_indication
        description: "The condition the drug was indicated for, as reported (FAERS drugindication)."
      - name: drug_batch_number
        description: "Manufacturer batch/lot number for the drug (FAERS drugbatchnumb)."
      - name: drug_authorization_number
        description: "Marketing authorization number for the drug (FAERS drugauthorizationnumb)."
      - name: administration_route
        description: "Route of administration (e.g. oral, intravenous), decoded from the FAERS drugadministrationroute code via the administration_route_mapping seed."
      - name: dosage_amount
        description: "Numeric dose amount as reported (FAERS drugstructuredosagenumb)."
      - name: dosage_unit_code
        description: >
          Raw FAERS drugstructuredosageunit code. Kept alongside the decoded
          dosage_unit because FDA documents only codes 1-4 and refers the rest
          to the ICH E2B(R2) spec, which the FAERS download does not bundle:
          2020q1 carries 36 distinct codes, so ~26% of dosed rows have a code
          this project cannot yet resolve. Surfacing it keeps those doses
          visibly unresolved rather than silently unitless.
      - name: dosage_unit
        description: >
          Decoded unit for dosage_amount, from the dosage_unit_mapping seed.
          Null where the code is outside the four FDA documents. Symbols are
          the correct SI ones (kg, g, mg, µg); the FAERS spec table renders
          them "G" and "Mg", but Mg is megagram in SI and mg is milligram — a
          10^9 difference on a dose, so the spec's casing is not reproduced.
        data_tests:
          - accepted_values:
              arguments:
                values: ["kg", "g", "mg", "µg"]
              config:
                severity: warn
      - name: start_date
        description: "Date the drug treatment started. Parsed via the faers_to_date macro, so year- or month-only precision dates are padded to the 1st rather than dropped, and values too short to be a year become null."
        data_tests:
          # A 4-digit year passes the macro's length gate but can still be a
          # typo (3019 for 2019). Warn rather than error: these are faults in
          # the source data, not in the model, and the count is worth watching.
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'1900-01-01'::date"
                max_value: "current_date()"
              config:
                severity: warn
      - name: end_date
        description: "Date the drug treatment ended. Parsed via the faers_to_date macro, so year- or month-only precision dates are padded to the 1st rather than dropped, and values too short to be a year become null."
        data_tests:
          # A 4-digit year passes the macro's length gate but can still be a
          # typo (3019 for 2019). Warn rather than error: these are faults in
          # the source data, not in the model, and the count is worth watching.
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'1900-01-01'::date"
                max_value: "current_date()"
              config:
                severity: warn
      - name: duration
        description: "Reported treatment duration (FAERS drugtreatmentduration), in the unit given by duration_unit."
      - name: duration_unit
        description: "Unit for duration (e.g. day, week), decoded from the FAERS drugtreatmentdurationunit code via the time_unit_code_mapping seed."
      - name: drug_recurrence
        description: >
          Whether the adverse event recurred when this drug was re-administered:
          yes, no, or unknown (from the FAERS drugrecurreadministration code 1-3).
          Distinct from recurrence_action, which is the action code from that
          recurrence event rather than whether recurrence happened at all.
        data_tests:
          - accepted_values:
              arguments:
                values: ["yes", "no", "unknown"]
              config:
                severity: warn
      - name: recurrence_action
        description: >
          Action-code (drugrecuraction) associated with a recurrence-administration
          event for this drug, passed through unmapped. Distinct from
          drug_recurrence: this is the outcome of a specific recurrence event, not
          whether recurrence was reported at all. parser.py collapses the FAERS
          drugrecurrence array (which can have multiple entries per drug) down to
          one row per drug by keeping the last entry with a non-null value here.
      - name: taken_action
        description: >
          Decoded action taken with the drug in response to the adverse event
          (FAERS actiondrug codes 1-6, per the bundled XML_NTS spec). Was
          previously passed through as a bare integer, which would have put a
          meaningless "3" on a dashboard where it means "dose increased".
        data_tests:
          - accepted_values:
              arguments:
                values: ["drug withdrawn", "dose reduced", "dose increased",
                         "dose not changed", "unknown", "not applicable"]
              config:
                severity: warn
      - name: use_stopped_reduced
        description: >
          Dechallenge outcome (FAERS drugadditional, codes 1-3): whether the
          event ABATED after the drug was stopped or the dose reduced — not
          whether the drug was stopped, which is what the column name suggests
          and what this description previously said. A positive dechallenge is
          a causality signal, so the distinction matters for any attribution
          analysis. Values: yes, no, "doesn't Apply".
        data_tests:
          - accepted_values:
              arguments:
                # The apostrophe is doubled for SQL, not a typo: dbt's
                # accepted_values macro quotes each value without escaping it.
                values: ["yes", "no", "doesn''t Apply"]
              config:
                severity: warn
      - name: source_quarter
        description: "FAERS quarter this drug entry was loaded from, e.g. 2021q4. Lets int_drugs keep one publication of a report version that FDA republished in a later quarter."
        data_tests:
          - not_null

  - name: stg_reaction
    description: "Model for cleaning and transforming the FAERS reaction data"
    columns:
      - name: report_id
        description: "FAERS safety report identifier. Anchors joins to the other staging models; not unique on its own since a report can have multiple versions (see version) and multiple reactions per version."
        data_tests:
          - not_null
      - name: version
        description: "FAERS report version number (safetyreportversion). Multiple versions of the same reaction are consolidated in int_reactions."
      - name: reaction
        description: "The MedDRA preferred term for the reaction"
        data_tests:
          - not_null
      - name: meddra_version
        description: "MedDRA dictionary version the reaction term was coded against (FAERS reactionmeddraversionpt)."
      - name: outcome
        description: "The outcome of the adverse event (e.g., recovered, not recovered)"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - "recovered/resolved"
                  - "recovering/resolving"
                  - "not recovered/not resolved"
                  - "recovered/resolved with sequelae"
                  - "fatal"
                  - "unknown"
              config:
                severity: warn
      - name: custom_reaction_group
        description: "Internal grouping key for the reaction, from the custom_reaction_groups_mapping seed (a project-defined MedDRA-derived grouping, not a FAERS field). Null for a term the seed does not cover yet."
        data_tests:
          # The seed was classified by hand from 2020q1's terms, so every newly
          # loaded quarter can bring terms it has never seen. A warning rather
          # than an error: the term is still usable ungrouped, and the fix is
          # to classify it and append it to the seed (see
          # analyses/unmapped_reaction_terms.sql).
          - not_null:
              config:
                severity: warn
      - name: custom_reaction_group_label
        description: "Human-readable label for custom_reaction_group, from the custom_reaction_groups_mapping seed."
      - name: custom_reaction_group_basis
        description: "Whether the reaction was grouped by an explicit rule or by fallback (custom_reaction_groups_mapping.mapping_basis). Lets consumers tell a confidently-grouped reaction from a catch-all one."
        data_tests:
          - accepted_values:
              arguments:
                values: ["rule", "fallback"]
              config:
                severity: warn

  - name: stg_reports
    description: "Model for cleaning and transforming the FAERS reports data"
    columns:
      - name: report_id
        description: "FAERS safety report identifier. Anchors joins to the other staging models; not unique on its own since a report can have multiple versions (see version)."
        data_tests:
          - not_null
      - name: version
        description: "FAERS report version number (safetyreportversion). Multiple versions of the same report_id are consolidated in int_reports."
      - name: receipt_date
        description: "The date the report was received. Parsed via the faers_to_date macro, so year- or month-only precision dates are padded to the 1st rather than dropped, and values too short to be a year become null."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'1900-01-01'::date"
                max_value: "current_date()"
              config:
                severity: warn
      - name: transmission_date
        description: "The date the report was transmitted. Parsed via the faers_to_date macro, so year- or month-only precision dates are padded to the 1st rather than dropped, and values too short to be a year become null."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'1900-01-01'::date"
                max_value: "current_date()"
              config:
                severity: warn
      - name: source_country
        description: >
          ISO code of the country the report originated from, mapped from the
          raw FAERS string via the country_mapping seed. Null for the 13,137
          2020q1 reports that name no country, and for 96 further ISO-3166
          codes (PR, PH, TH, PK, ...) the seed does not yet cover — 16,741 rows
          in total. Warning severity for that reason; extending the seed is
          tracked for dim_country in the marts layer.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: source_country_name
        description: "Readable name of source_country, from the country_mapping seed."
      - name: occurrence_country
        description: >
          ISO code of the country the adverse event occurred in, mapped via the
          country_mapping seed. Null where the report names no country or the
          seed lacks the code — see source_country.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: occurrence_country_name
        description: "Readable name of occurrence_country, from the country_mapping seed."
      - name: report_type
        description: >
          How the report reached FDA, decoded from the FAERS reporttype code.
          "not available to sender" (code 4) is a reported value meaning the
          sender does not know the type, distinct from null, which is the
          element being absent.
        data_tests:
          - accepted_values:
              arguments:
                values: ["spontaneous", "report from study", "other", "not available to sender"]
      - name: serious
        description: "Indicates whether the adverse event was serious"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["yes", "no"]
              config:
                severity: warn
      - name: congenital_anomaly
        description: "Boolean: whether the adverse event involved a congenital anomaly (FAERS seriousnesscongenitalanomali). A presence flag in FAERS: set to 1 when the criterion applies, element omitted otherwise. Decoded to a total boolean (absent = false) so it can be summed or averaged directly."
      - name: death
        description: "Boolean: whether the adverse event resulted in death (FAERS seriousnessdeath). A presence flag in FAERS: set to 1 when the criterion applies, element omitted otherwise. Decoded to a total boolean (absent = false) so it can be summed or averaged directly."
      - name: disabling
        description: "Boolean: whether the adverse event was disabling (FAERS seriousnessdisabling). A presence flag in FAERS: set to 1 when the criterion applies, element omitted otherwise. Decoded to a total boolean (absent = false) so it can be summed or averaged directly."
      - name: hospitalization
        description: "Boolean: whether the adverse event required hospitalization (FAERS seriousnesshospitalization). A presence flag in FAERS: set to 1 when the criterion applies, element omitted otherwise. Decoded to a total boolean (absent = false) so it can be summed or averaged directly."
      - name: lifethreatening
        description: "Boolean: whether the adverse event was life-threatening (FAERS seriousnesslifethreatening). A presence flag in FAERS: set to 1 when the criterion applies, element omitted otherwise. Decoded to a total boolean (absent = false) so it can be summed or averaged directly."
      - name: other_serious
        description: "Boolean: whether another, otherwise-uncategorized seriousness criterion applied (FAERS seriousnessother). A presence flag in FAERS: set to 1 when the criterion applies, element omitted otherwise. Decoded to a total boolean (absent = false) so it can be summed or averaged directly."
      - name: fulfill_expedite_criteria
        description: >
          Whether the report fulfills expedite criteria. E2B defines only
          1 = identified and 2 = other, but 2020q1 also carries out-of-spec
          codes 3, 4 and 5 on 27,125 rows, which decode to null rather than
          being invented into a category. not_null is therefore a warning, not
          an error: it tracks how much of the source is out of spec instead of
          asserting something the data cannot satisfy.
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values: ["identified", "other"]
              config:
                severity: warn
      - name: duplicate_flag
        description: "FAERS duplicate element. Despite the name this does not mark a redundant report: it is set on 94% of rows and never identifies a collision. Never used as a filter — see models/README.md."
      - name: duplicate_numb
        description: "Sender's own case number, byte-identical to company_number wherever populated (FAERS duplicatenumb). A case-linkage identifier, not a pointer to a redundant report."
      - name: duplicate_source
        description: "Organisation that supplied duplicate_numb (FAERS duplicatesource)."
      - name: authority_number
        description: "Regulatory authority's case number for the report (FAERS authoritynumb)."
      - name: company_number
        description: "Reporting company's internal case number for the report (FAERS companynumb)."
      - name: source_quarter
        description: "FAERS quarter this report version was loaded from, e.g. 2020q1. Carried so int_reports can record the span of quarters a report was published in."
        data_tests:
          - not_null

  - name: stg_deleted_cases
    description: >
      Reports retracted by FDA, unioned across every quarter's deleted-case file.
      Used as an anti-join by every intermediate model.
    columns:
      - name: report_id
        description: Retracted FAERS case number.
        data_tests:
          - not_null
          - unique
